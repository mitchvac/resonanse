# Resonance — nginx vhost for resonanse.app ONLY.
# Install:  sudo cp deploy/nginx-resonanse.conf /etc/nginx/sites-available/resonanse
#           sudo ln -sfn /etc/nginx/sites-available/resonanse /etc/nginx/sites-enabled/resonanse
#           sudo nginx -t && sudo systemctl reload nginx
# Then SSL: sudo certbot --nginx -d resonanse.app -d www.resonanse.app
#
# THIS BOX ALSO HOSTS wflowprocess.app. Do not add default_server. Do not
# `rm` other sites-enabled files. Do not 301 unknown Hosts here.

# www → apex redirect
server {
    listen 80;
    server_name www.resonanse.app;
    return 301 https://resonanse.app$request_uri;
}

server {
    listen 80;
    server_name resonanse.app;

    client_max_body_size 25m;

    # Security headers (Mozilla Observatory). `always` so they ride error
    # responses too. NOTE: nginx add_header is NOT inherited by locations that
    # set their own add_header (the alias blocks below) — those serve static
    # text and don't need them; `location /` inherits all of these.
    # CSP notes:
    #  - the sha256 hash allows the inline theme-bootstrap <script> in
    #    index.html; if that script's text changes, recompute:
    #    curl -s https://resonanse.app/ | perl -0ne 'print $1 while /<script>(.*?)<\/script>/gs' | openssl dgst -sha256 -binary | base64
    #  - googlesyndication/doubleclick/google = AdSense; openstreetmap = the
    #    event-detail map iframe; fonts.googleapis/gstatic = Google Fonts.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-bYWiin1dnqUAQCPDEcAAh201xjP0jvZJ1hVzRHm0o6Q=' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://www.googletagservices.com https://partner.googleadservices.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.gstatic.com; media-src 'self' blob:; frame-src 'self' https://www.openstreetmap.org https://*.googlesyndication.com https://*.doubleclick.net https://www.google.com; connect-src 'self' wss://resonanse.app https://*.googlesyndication.com https://*.doubleclick.net https://adservice.google.com https://*.google.com https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # AEO files live in the unpacked source. Serving them from disk means a
    # container built before those files existed still answers 200.
    location = /llms.txt {
        alias /opt/resonance/public/llms.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }
    location = /robots.txt {
        alias /opt/resonance/public/robots.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }
    location = /sitemap.xml {
        alias /opt/resonance/public/sitemap.xml;
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }
    location = /.well-known/botcentral.txt {
        alias /opt/resonance/public/.well-known/botcentral.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
