# Resonance — nginx reverse proxy for resonanse.app
# Install:  sudo cp nginx-resonanse.conf /etc/nginx/sites-available/resonanse
#           sudo ln -s /etc/nginx/sites-available/resonanse /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then SSL: sudo certbot --nginx -d resonanse.app -d www.resonanse.app
# (certbot rewrites this file to add the ssl_certificate lines automatically)

# www → apex redirect
server {
    listen 80;
    server_name www.resonanse.app;
    return 301 https://resonanse.app$request_uri;
}

server {
    listen 80;
    server_name resonanse.app;

    # Photo uploads (profile pictures) can be several MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Long-lived requests (voice-note transcription, KYC face checks)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
