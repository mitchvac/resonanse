<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Resonance — Less swiping. More meeting.</title>
    <meta name="description" content="Resonance gives you a small daily queue of people who actually match your intent — then helps you get from hello to a real date." />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta property="og:title" content="Resonance — Date with intent" />
    <meta property="og:description" content="A daily queue of 5–10 people chosen for mutual intent. Photo-verified. Built for real dates." />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:type" content="website" />
    <script>
      // Theme bootstrap: persisted choice wins, else OS preference, default light (Warm Glass).
      (function () {
        try {
          var saved = localStorage.getItem('resonance-theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
